<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Suporte Técnico</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.app{max-width:1100px;margin:auto;padding:32px 20px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}.eyebrow{color:#2563eb;font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.78rem}h1{margin:.35rem 0;font-size:clamp(2rem,5vw,3.4rem)}.muted{color:#667085}.grid{display:grid;grid-template-columns:360px 1fr;gap:20px}@media(max-width:800px){.grid{grid-template-columns:1fr}.hero{display:block}}.card{background:#fff;border:1px solid #e4eaf2;border-radius:18px;padding:20px;box-shadow:0 8px 24px #14213d0b}label{display:block;font-weight:700;font-size:.9rem;margin:14px 0 6px}input,select,textarea,button{width:100%;font:inherit;border-radius:10px;border:1px solid #ccd5e1;padding:11px}textarea{min-height:100px;resize:vertical}button{border:0;background:#2563eb;color:#fff;font-weight:800;cursor:pointer;margin-top:16px}button.secondary{background:#eaf1ff;color:#1d4ed8}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.metric{background:#f7f9fc;padding:14px;border-radius:12px}.metric strong{display:block;font-size:1.5rem}.ticket{border:1px solid #e4eaf2;border-radius:12px;padding:14px;margin:10px 0}.ticket h3{margin:0 0 6px;font-size:1rem}.tag{display:inline-block;border-radius:99px;padding:3px 9px;background:#eef2ff;color:#3730a3;font-size:.76rem;margin-right:5px}.empty{text-align:center;padding:34px;color:#667085}.status{color:#047857}.notice{margin:12px 0;padding:10px;border-radius:10px;background:#ecfdf3;color:#047857;display:none}
</style>
</head>
<body>
<main class="app">
<header class="hero"><div><div class="eyebrow">Projeto de portfólio</div><h1>Central de Suporte Técnico</h1><p class="muted">Registro, priorização e acompanhamento de chamados com API REST e SQLite.</p></div><div class="muted">Modo demonstração local</div></header>
<div class="grid"><section class="card"><h2>Novo chamado</h2><div id="notice" class="notice"></div><form id="ticketForm"><label for="requester">Solicitante</label><input id="requester" required placeholder="Nome do solicitante"><label for="category">Categoria</label><input id="category" required placeholder="Acesso, hardware, software..."><label for="priority">Prioridade</label><select id="priority"><option value="medium">Média</option><option value="low">Baixa</option><option value="high">Alta</option><option value="critical">Crítica</option></select><label for="description">Descrição</label><textarea id="description" required placeholder="Descreva o problema..."></textarea><button type="submit">Registrar chamado</button></form><button class="secondary" id="clear">Limpar demonstração</button></section><section class="card"><h2>Painel operacional</h2><div class="metrics"><div class="metric"><span class="muted">Total</span><strong id="total">0</strong></div><div class="metric"><span class="muted">Abertos</span><strong id="open">0</strong></div><div class="metric"><span class="muted">Alta/crítica</span><strong id="urgent">0</strong></div></div><div><label for="filter">Filtrar status</label><select id="filter"><option value="">Todos</option><option value="open">Abertos</option><option value="in_progress">Em andamento</option><option value="resolved">Resolvidos</option><option value="closed">Fechados</option></select></div><div id="tickets"></div></section></div>
</main>
<script>
const key="central-suporte-demo";const sample=[{id:1,requester:"Exemplo",category:"Acesso",description:"Solicitação demonstrativa",priority:"high",status:"open",assignee:null}];let tickets=JSON.parse(localStorage.getItem(key)||"null")||sample;const $=id=>document.getElementById(id);function save(){localStorage.setItem(key,JSON.stringify(tickets))}function render(){const f=$("filter").value;const list=tickets.filter(t=>!f||t.status===f);$("total").textContent=tickets.length;$("open").textContent=tickets.filter(t=>t.status==="open").length;$("urgent").textContent=tickets.filter(t=>["high","critical"].includes(t.priority)).length;$("tickets").innerHTML=list.length?list.map(t=>`<article class="ticket"><h3>#${t.id} — ${t.category}</h3><span class="tag">${t.priority}</span><span class="tag status">${t.status}</span><p>${t.description}</p><small>Solicitante: ${t.requester}</small></article>`).join(""):"<div class=empty>Nenhum chamado encontrado.</div>"}$("ticketForm").addEventListener("submit",e=>{e.preventDefault();tickets.unshift({id:Date.now(),requester:$("requester").value.trim(),category:$("category").value.trim(),description:$("description").value.trim(),priority:$("priority").value,status:"open",assignee:null});save();e.target.reset();$("notice").textContent="Chamado registrado no modo demonstração.";$("notice").style.display="block";render()});$("filter").addEventListener("change",render);$("clear").addEventListener("click",()=>{tickets=[];save();render()});render();
</script>
</body>
</html>
